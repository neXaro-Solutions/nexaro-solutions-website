<style>

@keyframes pilotTakeoff{0%{opacity:0;transform:translate(0,0) rotate(-8deg) scale(.68)}10%{opacity:1;transform:translate(8px,-4px) rotate(-10deg) scale(1)}45%{opacity:1;transform:translate(26vw,-12vh) rotate(-13deg) scale(1.02)}78%{opacity:1;transform:translate(58vw,-30vh) rotate(-16deg) scale(.96)}100%{opacity:0;transform:translate(92vw,-52vh) rotate(-19deg) scale(.84)}}

function resultsView(){return '<div class="card"><h2>Results Library</h2>'+(results.map(r=>{const c=claims.filter(x=>x.result_id===r.id),evCount=evidence.filter(e=>c.some(x=>x.id===e.claim_id)).length,co=completeness.find(x=>x.document_id===r.structured_content?.document_id),canva=r.result_type==="canva_design";return '<div class="item"><div><span class="badge '+(r.quality_status==="ready"?"green":"orange")+'">'+esc(r.quality_status||"draft")+'</span> <span class="badge">v'+r.version+'</span></div><strong style="margin-top:8px">'+esc(r.title)+'</strong><div class="muted" style="white-space:pre-wrap">'+esc(r.content||"")+'</div>'+(r.result_type==="research_analysis"&&Array.isArray(r.structured_content?.sources)?'<div style="margin-top:12px"><strong>Quellen</strong>'+r.structured_content.sources.map(s=>'<div class="item"><span class="badge">'+esc(s.source_key||"source")+'</span><strong>'+esc(s.title||s.url||"Quelle")+'</strong><div class="muted">Evidence '+Math.round(Number(s.evidence_score||0)*100)+'%</div>'+(s.url?'<a class="btn" target="_blank" rel="noopener" href="'+esc(s.url)+'">Quelle öffnen</a>':'')+'</div>').join("")+'</div>':'')+(canva?'<div class="btns">'+(r.structured_content?.edit_url?'<a class="btn primary" href="'+esc(r.structured_content.edit_url)+'" target="_blank" rel="noopener">In Canva bearbeiten</a>':'')+(r.structured_content?.url?'<a class="btn" href="'+esc(r.structured_content.url)+'" target="_blank" rel="noopener">Canva öffnen</a>':'')+'</div>':'<div class="stat"><span class="muted">Claims</span><strong>'+c.length+'</strong></div><div class="stat"><span class="muted">Evidence</span><strong>'+evCount+'</strong></div><div class="stat"><span class="muted">Completeness</span><strong>'+esc(co?.readiness||r.structured_content?.completeness?.readiness||"—")+'</strong></div><div class="btns"><button class="btn primary" data-canva="'+r.id+':presentation">✦ Canva Präsentation</button><button class="btn" data-canva="'+r.id+':doc">Canva Doc</button><button class="btn" data-feedback="'+r.id+':up">👍 Hilfreich</button><button class="btn" data-feedback="'+r.id+':down">👎 Verbessern</button></div>')+'</div>'}).join("")||'<p class="muted">Noch keine Results.</p>')+'</div>'}
async function uploadDocument(){const f=document.getElementById("fileInput")?.files?.[0];if(!f)return;if(!goals[0])return alert("Bitte zuerst ein aktives Goal anlegen.");const btn=document.getElementById("uploadDoc");btn.disabled=true;btn.textContent="Upload läuft …";PS.textContent="Pilot verarbeitet Dokument …";try{const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,"_");const path=user.id+"/"+crypto.randomUUID()+"-"+safe;const up=await sb.storage.from("documents").upload(path,f,{contentType:f.type||"application/octet-stream",upsert:false});if(up.error)throw up.error;const ins=await sb.from("documents").insert({organization_id:org.organization_id,owner_id:user.id,filename:f.name,title:f.name,mime_type:f.type||"application/octet-stream",language:"de",storage_path:path,processing_status:"uploaded",sensitivity:"internal",metadata:{size:f.size}}).select("*").single();if(ins.error)throw ins.error;const pr=await sb.functions.invoke("document-processor",{body:{document_id:ins.data.id,goal_id:goals[0].id}});if(pr.error)throw pr.error;await load();await telemetry("event",{goal_id:goals[0]?.id||null,event_name:"document_processed",event_category:"value",properties:{document_count:documents.length,result_count:results.length}});PS.textContent="Pilot bereit";render()}catch(e){PS.textContent="Pilot bereit";await telemetry("incident",{goal_id:goals[0]?.id||null,source:"documents",severity:"error",error_code:"DOCUMENT_FAILED",message:e.message||String(e)});alert(e.message||String(e));btn.disabled=false;btn.textContent="Hochladen & analysieren"}}
function canvaView(){return '<div class="grid"><div class="card"><h2>Canva Execution</h2><p class="muted">Pilot übergibt geprüfte Inhalte an Canva. Reasoning bleibt bei neXaro; Canva übernimmt die visuelle Ausführung.</p><div class="stat"><span class="muted">Verbindung</span><strong>'+(canvaStatus?.connected?'Verbunden':'Nicht verbunden')+'</strong></div><div class="stat"><span class="muted">Generative Designs</span><strong>Docs & Präsentationen</strong></div><div class="stat"><span class="muted">Brand Autofill</span><strong>Templates / Designs</strong></div><div class="btns">'+(!canvaStatus?.connected?'<button id="connectCanva" class="btn primary">Canva verbinden</button>':'<span class="badge green">Canva verbunden</span>')+'</div></div><div class="card"><h3>Design Jobs</h3>'+(designJobs.map(j=>'<div class="item"><span class="badge '+(j.status==="completed"?"green":j.status==="failed"?"orange":"")+'">'+esc(j.status)+'</span><strong>'+esc(j.design_type)+'</strong><div class="muted">'+esc(j.brief?.text||"Canva Design")+'</div><div class="btns">'+(j.status==="running"?'<button class="btn" data-canva-poll="'+j.id+'">Status aktualisieren</button>':'')+(j.provider_edit_url?'<a class="btn primary" target="_blank" rel="noopener" href="'+esc(j.provider_edit_url)+'">Bearbeiten</a>':'')+(j.provider_url?'<a class="btn" target="_blank" rel="noopener" href="'+esc(j.provider_url)+'">Öffnen</a>':'')+'</div></div>').join("")||'<p class="muted">Noch keine Canva-Jobs.</p>')+'</div></div>'}
function roadmap(){const c=features.reduce((a,f)=>(a[f.status]=(a[f.status]||0)+1,a),{});return '<div class="card"><h2>Feature Registry</h2><p class="muted">Nicht integrierte Funktionen bleiben registriert und werden nicht vergessen.</p><div class="btns"><span class="badge green">MVP '+(c.mvp||0)+'</span><span class="badge">Alpha '+(c.alpha||0)+'</span><span class="badge">Planned '+(c.planned||0)+'</span><span class="badge orange">Deferred '+(c.deferred||0)+'</span></div>'+features.map(f=>'<div class="item"><strong>'+f.workspace_number+'. '+esc(f.name)+'</strong><span class="badge">'+esc(f.status)+'</span> <span class="muted">'+esc(f.priority)+'</span></div>').join("")+'</div>'}
function alphaView(){const passed=readiness.filter(x=>x.status==="passed").length,total=readiness.length,last=evalRuns[0],aiCost=aiRequests.reduce((s,x)=>s+Number(x.actual_cost||0),0);return '<div class="grid"><div class="card"><h2>Private Alpha Readiness</h2><div style="font-size:42px;font-weight:900">'+passed+' / '+total+'</div><p class="muted">Pflichtchecks bestanden</p>'+readiness.map(x=>'<div class="stat"><span class="muted">'+esc(x.description)+'</span><strong>'+esc(x.status)+'</strong></div>').join("")+'<div class="btns"><button id="runEvals" class="btn primary">Evaluation Suite ausführen</button></div></div><div><div class="card"><h3>Evaluation</h3>'+(last?'<div class="stat"><span class="muted">Status</span><strong>'+esc(last.status)+'</strong></div><div class="stat"><span class="muted">Score</span><strong>'+Math.round(Number(last.score||0)*100)+'%</strong></div><div class="stat"><span class="muted">Cases</span><strong>'+last.passed_cases+' / '+last.total_cases+'</strong></div>':'<p class="muted">Noch kein Eval-Run.</p>')+'</div><div class="card" style="margin-top:20px"><h3>AI Cost Monitor</h3><div class="stat"><span class="muted">Requests</span><strong>'+aiRequests.length+'</strong></div><div class="stat"><span class="muted">Aktuelle Kosten</span><strong>'+aiCost.toFixed(4)+'</strong></div><div class="stat"><span class="muted">Fallbacks</span><strong>'+aiRequests.filter(x=>x.fallback_used).length+'</strong></div></div><div class="card" style="margin-top:20px"><h3>Notifications</h3>'+(notifications.map(n=>'<div class="item"><span class="badge">'+esc(n.priority)+'</span><strong>'+esc(n.title)+'</strong><div class="muted">'+esc(n.body)+'</div></div>').join("")||'<p class="muted">Keine offenen Hinweise.</p>')+'</div></div></div>'}
function me(){return '<div class="grid"><div class="card"><h2>Me</h2><div class="stat"><span class="muted">E-Mail</span><strong>'+esc(user.email)+'</strong></div><div class="stat"><span class="muted">Workspace</span><strong>Personal</strong></div></div><div class="card"><h3>Security</h3><p class="muted">Pilot Intelligence verarbeitet nur deine User-Session. Alle Schreib- und Lesezugriffe bleiben unter Row-Level-Security.</p></div></div>'}
function render(){document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===current));T.textContent={home:"Home",goals:"Goals",documents:"Documents",results:"Results",canva:"Canva",roadmap:"Roadmap",alpha:"Alpha",me:"Me"}[current];V.innerHTML={home:home,goals:goalsView,documents:documentsView,results:resultsView,canva:canvaView,roadmap:roadmap,alpha:alphaView,me:me}[current]();bind()}
function bind(){document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{current=b.dataset.view;render()});document.getElementById("createGoal")?.addEventListener("click",createGoal);document.getElementById("executeAction")?.addEventListener("click",executeAction);document.getElementById("uploadDoc")?.addEventListener("click",uploadDocument);document.getElementById("completeAction")?.addEventListener("click",()=>completeAction(false,false));document.getElementById("completeWithOutcome")?.addEventListener("click",()=>completeAction(true,false));document.getElementById("markBlocked")?.addEventListener("click",()=>completeAction(false,true));document.querySelectorAll("[data-feedback]").forEach(b=>b.onclick=()=>sendFeedback(b.dataset.feedback));document.getElementById("runEvals")?.addEventListener("click",runEvals);document.getElementById("connectCanva")?.addEventListener("click",connectCanva);document.querySelectorAll("[data-canva]").forEach(b=>b.onclick=()=>designWithCanva(b.dataset.canva));document.querySelectorAll("[data-canva-poll]").forEach(b=>b.onclick=()=>pollCanva(b.dataset.canvaPoll));document.querySelectorAll("[data-exec-approve]").forEach(b=>b.onclick=()=>decideExecution(b.dataset.execApprove,true));document.querySelectorAll("[data-exec-reject]").forEach(b=>b.onclick=()=>decideExecution(b.dataset.execReject,false))}
async function createGoal(){
  const text=document.getElementById("goalText").value.trim();if(!text||!org)return;const btn=document.getElementById("createGoal");btn.disabled=true;btn.textContent="Pilot versteht …";PS.textContent="Pilot versteht …";
  try{
    let r=await sb.functions.invoke("pilot-intelligence",{body:{input:text}});if(r.error)throw r.error;let data=r.data;
    if(data.stage==="clarification"){const answers={};for(const q of data.questions||[]){const ans=window.prompt(q.question_de||q.question_en||"Weitere Angabe");if(ans)answers[q.key]=ans}PS.textContent="Pilot plant …";r=await sb.functions.invoke("pilot-intelligence",{body:{input:text,intent:data.intent,answers}});if(r.error)throw r.error;data=r.data}
    if(data.stage!=="ready")throw new Error("Pilot konnte den Plan nicht abschließen.");
    PS.textContent="Pilot bereit";await load();telemetry("event",{goal_id:goals[0]?.id||null,event_name:"goal_created",event_category:"activation",properties:{domain:goals[0]?.domain?.primary||"general"}});render();
  }catch(e){PS.textContent="Pilot bereit";alert(e.message||String(e));btn.disabled=false;btn.textContent="Pilot starten"}
}
async function completeAction(withOutcome,blocked){const n=actions.find(a=>a.status==="ready")||actions.find(a=>a.status==="pending");if(!n)return;let outcome=null;if(withOutcome){const metric=window.prompt("Welche Kennzahl möchtest du messen? Zum Beispiel: Leads");if(metric){const current=window.prompt("Aktueller Wert?");const target=window.prompt("Zielwert?");const unit=window.prompt("Einheit? Zum Beispiel: Leads, %, EUR")||"";outcome={metric,current_value:Number(current||0),target:Number(target||0),unit}}}PS.textContent="Pilot aktualisiert Fortschritt …";try{const r=await sb.functions.invoke("progress-engine",{body:{action_id:n.id,outcome,blocked}});if(r.error)throw r.error;await load();await telemetry("event",{goal_id:goals[0]?.id||null,event_name:"progress_updated",event_category:"outcome",properties:{outcome_attached:!!outcome,blocked:!!blocked}});PS.textContent="Pilot bereit";render()}catch(e){PS.textContent="Pilot bereit";await telemetry("incident",{goal_id:goals[0]?.id||null,source:"progress",severity:"error",error_code:"PROGRESS_FAILED",message:e.message||String(e)});alert(e.message||String(e))}}
async function sendFeedback(v){const [id,rating]=v.split(":");let reason=null;if(rating==="down")reason=window.prompt("Was sollte verbessert werden?")||null;await telemetry("feedback",{goal_id:goals[0]?.id||null,target_type:"result",target_id:id,rating,reason});await telemetry("event",{goal_id:goals[0]?.id||null,event_name:"result_feedback",event_category:"feedback",properties:{rating}});alert("Danke – Feedback gespeichert.")}
async function runEvals(){PS.textContent="Evaluation läuft …";try{const r=await sb.functions.invoke("evaluation-runner",{body:{suite:"alpha-core"}});if(r.error)throw r.error;await load();render();PS.textContent="Pilot bereit"}catch(e){PS.textContent="Pilot bereit";await telemetry("incident",{source:"evaluation",severity:"error",error_code:"EVAL_FAILED",message:e.message||String(e)});alert(e.message||String(e))}}
async function connectCanva(){try{const r=await sb.functions.invoke("canva-oauth-start",{body:{return_url:location.origin+location.pathname}});if(r.error)throw r.error;if(r.data?.authorization_url)location.href=r.data.authorization_url;else alert("Canva Developer-Konfiguration fehlt: "+(r.data?.missing||[]).join(", "))}catch(e){alert(e.message||String(e))}}
async function designWithCanva(v){const [id,type]=v.split(":");const r=results.find(x=>x.id===id);if(!r)return;const brief=["Create a professional neXaro-branded "+type+" based on this approved result. Use a light, premium layout with neon green and neon orange accents, high readability, and restrained visual energy. Preserve facts and wording accuracy.","","Title: "+r.title,"","Content:",String(r.content||"").slice(0,4200)].join("\\n");PS.textContent="Canva wird vorbereitet …";try{const x=await sb.functions.invoke("canva-execution",{body:{action:"generate",goal_id:goals[0]?.id||null,source_result_id:r.id,design_type:type,brief}});if(x.error&&x.data?.status!=="canva_connection_required")throw x.error;if(x.data?.status==="canva_connection_required"){const url=x.data?.connect?.authorization_url;if(url){location.href=url;return}alert("Canva Developer-Konfiguration ist noch nicht vollständig.");return}await load();current="canva";render();PS.textContent="Pilot bereit"}catch(e){PS.textContent="Pilot bereit";alert(e.message||String(e))}}
async function pollCanva(id){PS.textContent="Canva Job wird geprüft …";try{const x=await sb.functions.invoke("canva-execution",{body:{action:"poll",design_job_id:id}});if(x.error)throw x.error;await load();render();PS.textContent="Pilot bereit"}catch(e){PS.textContent="Pilot bereit";alert(e.message||String(e))}}
function startPilotFlight(btn){const layer=document.getElementById("pilotFlightLayer");if(!layer||!btn)return;const reduced=window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches;if(reduced)return;const rect=btn.getBoundingClientRect();const plane=document.createElement("div");plane.className="pilot-plane";plane.textContent="✈";plane.style.left=(rect.left+rect.width*.58-23)+"px";plane.style.top=(rect.top+rect.height*.16-10)+"px";layer.appendChild(plane);plane.addEventListener("animationend",()=>plane.remove(),{once:true});setTimeout(()=>{if(plane.isConnected)plane.remove()},2000)}
async function executeAction(){const n=actions.find(a=>a.status==="ready")||actions.find(a=>a.status==="pending");if(!n)return;const btn=document.getElementById("executeAction");btn?.classList.add("launching");startPilotFlight(btn);PS.textContent="Pilot hebt ab …";setTimeout(()=>{if(PS.textContent==="Pilot hebt ab …")PS.textContent="Pilot arbeitet …"},650);try{const r=await sb.functions.invoke("execution-engine",{body:{operation:"start",action_id:n.id}});if(r.error)throw r.error;await load();render();PS.textContent=r.data?.status==="waiting_approval"?"Freigabe erforderlich":"Pilot bereit";if(r.data?.status==="waiting_approval")alert("Pilot hat die Arbeit vorbereitet. Die externe Aktion wartet auf deine Freigabe.");if(r.data?.status==="review_required")alert("Pilot hat das Resultat erstellt. Aufgrund des Risikoprofils ist eine menschliche Prüfung erforderlich.")}catch(e){PS.textContent="Pilot bereit";await telemetry("incident",{goal_id:goals[0]?.id||null,source:"execution",severity:"error",error_code:"EXECUTION_FAILED",message:e.message||String(e)});alert(e.message||String(e))}finally{setTimeout(()=>btn?.classList.remove("launching"),700)}}
async function decideExecution(v,approved){const [execution_id,step_id]=v.split(":");const reason=approved?null:(window.prompt("Warum möchtest du diese Aktion ablehnen?")||null);PS.textContent=approved?"Freigabe wird verarbeitet …":"Aktion wird abgebrochen …";try{const r=await sb.functions.invoke("execution-engine",{body:{operation:"approve",execution_id,step_id,approved,reason}});if(r.error&&r.data?.status!=="blocked")throw r.error;await load();render();PS.textContent="Pilot bereit";if(r.data?.status==="blocked")alert("Freigabe wurde erfasst. Die externe Capability ist noch nicht verbunden; Pilot hat deshalb nicht ausgeführt.")}catch(e){PS.textContent="Pilot bereit";alert(e.message||String(e))}}
async function enter(session){user=session.user;A.classList.add("hidden");APP.classList.remove("hidden");try{await load();render();telemetry("event",{event_name:"session_entered",event_category:"activation",properties:{has_goal:!!goals[0]}})}catch(e){telemetry("incident",{source:"app_load",severity:"error",error_code:"LOAD_FAILED",message:e.message||String(e)});alert(e.message)}}
async function leave(){user=null;org=null;goals=[];features=[];plans=[];actions=[];contexts=[];milestones=[];documents=[];results=[];claims=[];evidence=[];completeness=[];progressEvents=[];outcomes=[];adaptations=[];pilotState=null;aiRequests=[];qualityContracts=[];consensusRuns=[];executions=[];executionSteps=[];designJobs=[];canvaStatus=null;notifications=[];readiness=[];evalRuns=[];APP.classList.add("hidden");A.classList.remove("hidden")}
document.getElementById("login").onclick=async()=>{const r=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error)return message(r.error.message,false);await enter(r.data.session)}
document.getElementById("signup").onclick=async()=>{if(password.value.length<8)return message("Passwort muss mindestens 8 Zeichen haben.",false);const r=await sb.auth.signUp({email:email.value.trim(),password:password.value,options:{data:{full_name:email.value.split("@")[0]}}});if(r.error)return message(r.error.message,false);if(r.data.session){message("Account erstellt.",true);await enter(r.data.session)}else message("Account erstellt. Bitte bestätige deine E-Mail und melde dich anschließend an.",true)}
document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();await leave()}
const sess=(await sb.auth.getSession()).data.session;if(sess)await enter(sess);
</script></body></html>
