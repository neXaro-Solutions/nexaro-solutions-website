async function completeAction(withOutcome,blocked){const n=actions.find(a=>a.status==="ready")||actions.find(a=>a.status==="pending");if(!n)return;let outcome=null;if(withOutcome){const metric=window.prompt("Welche Kennzahl möchtest du messen? Zum Beispiel: Leads");if(metric){const current=window.prompt("Aktueller Wert?");const target=window.prompt("Zielwert?");const unit=window.prompt("Einheit? Zum Beispiel: Leads, %, EUR")||"";outcome={metric,current_value:Number(current||0),target:Number(target||0),unit}}}PS.textContent="Pilot aktualisiert Fortschritt …";try{const r=await sb.functions.invoke("progress-engine",{body:{action_id:n.id,outcome,blocked}});if(r.error)throw r.error;await load();await telemetry("event",{goal_id:goals[0]?.id||null,event_name:"progress_updated",event_category:"outcome",properties:{outcome_attached:!!outcome,blocked:!!blocked}});PS.textContent="Pilot bereit";render()}catch(e){PS.textContent="Pilot bereit";await telemetry("incident",{goal_id:goals[0]?.id||null,source:"progress",severity:"error",error_code:"PROGRESS_FAILED",message:e.message||String(e)});alert(e.message||String(e))}}
async function sendFeedback(v){const [id,rating]=v.split(":");let reason=null;if(rating==="down")reason=window.prompt("Was sollte verbessert werden?")||null;await telemetry("feedback",{goal_id:goals[0]?.id||null,target_type:"result",target_id:id,rating,reason});await telemetry("event",{goal_id:goals[0]?.id||null,event_name:"result_feedback",event_category:"feedback",properties:{rating}});alert("Danke – Feedback gespeichert.")}
async function runAlphaE2E(){const btn=document.getElementById("runAlphaE2E"),s=document.getElementById("e2eStatus");if(btn)btn.disabled=true;if(s)s.textContent="Systemtest läuft: Execution → Best-of-AI → Result → Verification → Progress …";PS.textContent="Pilot prüft das System …";try{const r=await sb.functions.invoke("alpha-e2e-selftest",{body:{}});if(r.error)throw Object.assign(new Error(r.data?.error||r.error.message||"E2E-Test fehlgeschlagen"),{detail:r.data});const checks=r.data?.checks||[];if(s)s.innerHTML='<strong>Systemtest bestanden ✓</strong><br>'+checks.map(c=>(c.passed?'✓ ':'✕ ')+esc(c.check)).join('<br>');await load();render();PS.textContent="Pilot bereit"}catch(e){const d=e.detail||{};const checks=d.checks||[];if(s)s.innerHTML='<strong>Systemtest fehlgeschlagen</strong><br>'+esc(d.error||e.message||String(e))+(checks.length?'<br>'+checks.map(c=>(c.passed?'✓ ':'✕ ')+esc(c.check)).join('<br>'):'');PS.textContent="Prüfung erforderlich";await load();render()}finally{if(btn)btn.disabled=false}}
async function runEvals(){PS.textContent="Evaluation läuft …";try{const r=await sb.functions.invoke("evaluation-runner",{body:{suite:"alpha-core"}});if(r.error)throw r.error;await load();render();PS.textContent="Pilot bereit"}catch(e){PS.textContent="Pilot bereit";await telemetry("incident",{source:"evaluation",severity:"error",error_code:"EVAL_FAILED",message:e.message||String(e)});alert(e.message||String(e))}}
async function connectCanva(){try{const r=await sb.functions.invoke("canva-oauth-start",{body:{return_url:location.origin+location.pathname}});if(r.error)throw r.error;if(r.data?.authorization_url)location.href=r.data.authorization_url;else alert("Canva Developer-Konfiguration fehlt: "+(r.data?.missing||[]).join(", "))}catch(e){alert(e.message||String(e))}}
async function designWithCanva(v){const [id,type]=v.split(":");const r=results.find(x=>x.id===id);if(!r)return;const brief=["Create a professional neXaro-branded "+type+" based on this approved result. Use a light, premium layout with neon green and neon orange accents, high readability, and restrained visual energy. Preserve facts and wording accuracy.","","Title: "+r.title,"","Content:",String(r.content||"").slice(0,4200)].join("\\n");PS.textContent="Canva wird vorbereitet …";try{const x=await sb.functions.invoke("canva-execution",{body:{action:"generate",goal_id:goals[0]?.id||null,source_result_id:r.id,design_type:type,brief}});if(x.error&&x.data?.status!=="canva_connection_required")throw x.error;if(x.data?.status==="canva_connection_required"){const url=x.data?.connect?.authorization_url;if(url){location.href=url;return}alert("Canva Developer-Konfiguration ist noch nicht vollständig.");return}await load();current="canva";render();PS.textContent="Pilot bereit"}catch(e){PS.textContent="Pilot bereit";alert(e.message||String(e))}}
async function pollCanva(id){PS.textContent="Canva Job wird geprüft …";try{const x=await sb.functions.invoke("canva-execution",{body:{action:"poll",design_job_id:id}});if(x.error)throw x.error;await load();render();PS.textContent="Pilot bereit"}catch(e){PS.textContent="Pilot bereit";alert(e.message||String(e))}}
function startPilotFlight(btn){const layer=document.getElementById("pilotFlightLayer");if(!layer||!btn)return;const reduced=window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches;if(reduced)return;const rect=btn.getBoundingClientRect();const plane=document.createElement("div");plane.className="pilot-plane";plane.textContent="✈";plane.style.left=(rect.left+rect.width*.58-23)+"px";plane.style.top=(rect.top+rect.height*.16-10)+"px";layer.appendChild(plane);plane.addEventListener("animationend",()=>plane.remove(),{once:true});setTimeout(()=>{if(plane.isConnected)plane.remove()},2000)}
async function executeAction(){const n=actions.find(a=>a.status==="ready")||actions.find(a=>a.status==="pending");if(!n)return;const btn=document.getElementById("executeAction");btn?.classList.add("launching");startPilotFlight(btn);PS.textContent="Pilot hebt ab …";setTimeout(()=>{if(PS.textContent==="Pilot hebt ab …")PS.textContent="Pilot arbeitet …"},650);try{const r=await sb.functions.invoke("execution-engine",{body:{operation:"start",action_id:n.id}});if(r.error)throw r.error;await load();render();PS.textContent=r.data?.status==="waiting_approval"?"Freigabe erforderlich":"Pilot bereit";if(r.data?.status==="waiting_approval")alert("Pilot hat die Arbeit vorbereitet. Die externe Aktion wartet auf deine Freigabe.");if(r.data?.status==="review_required")alert("Pilot hat das Resultat erstellt. Aufgrund des Risikoprofils ist eine menschliche Prüfung erforderlich.")}catch(e){PS.textContent="Pilot bereit";await telemetry("incident",{goal_id:goals[0]?.id||null,source:"execution",severity:"error",error_code:"EXECUTION_FAILED",message:e.message||String(e)});alert(e.message||String(e))}finally{setTimeout(()=>btn?.classList.remove("launching"),700)}}
async function decideExecution(v,approved){const [execution_id,step_id]=v.split(":");const reason=approved?null:(window.prompt("Warum möchtest du diese Aktion ablehnen?")||null);PS.textContent=approved?"Freigabe wird verarbeitet …":"Aktion wird abgebrochen …";try{const r=await sb.functions.invoke("execution-engine",{body:{operation:"approve",execution_id,step_id,approved,reason}});if(r.error&&r.data?.status!=="blocked")throw r.error;await load();render();PS.textContent="Pilot bereit";if(r.data?.status==="blocked")alert("Freigabe wurde erfasst. Die externe Capability ist noch nicht verbunden; Pilot hat deshalb nicht ausgeführt.")}catch(e){PS.textContent="Pilot bereit";alert(e.message||String(e))}}
async function enter(session){user=session.user;A.classList.add("hidden");APP.classList.remove("hidden");try{await load();render();telemetry("event",{event_name:"session_entered",event_category:"activation",properties:{has_goal:!!goals[0]}})}catch(e){telemetry("incident",{source:"app_load",severity:"error",error_code:"LOAD_FAILED",message:e.message||String(e)});alert(e.message)}}
async function leave(){user=null;org=null;goals=[];features=[];plans=[];actions=[];contexts=[];milestones=[];documents=[];results=[];claims=[];evidence=[];completeness=[];progressEvents=[];outcomes=[];adaptations=[];pilotState=null;aiRequests=[];qualityContracts=[];consensusRuns=[];executions=[];executionSteps=[];designJobs=[];canvaStatus=null;notifications=[];readiness=[];evalRuns=[];APP.classList.add("hidden");A.classList.remove("hidden")}
document.getElementById("login").onclick=async()=>{const r=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error)return message(r.error.message,false);await enter(r.data.session)}
document.getElementById("signup").onclick=async()=>{if(password.value.length<8)return message("Passwort muss mindestens 8 Zeichen haben.",false);const r=await sb.auth.signUp({email:email.value.trim(),password:password.value,options:{data:{full_name:email.value.split("@")[0]}}});if(r.error)return message(r.error.message,false);if(r.data.session){message("Account erstellt.",true);await enter(r.data.session)}else message("Account erstellt. Bitte bestätige deine E-Mail und melde dich anschließend an.",true)}
document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();await leave()}
const sess=(await sb.auth.getSession()).data.session;if(sess)await enter(sess);
</script></body></html>
