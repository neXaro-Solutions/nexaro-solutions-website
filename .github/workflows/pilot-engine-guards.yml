name: Pilot engine regression tests

on:
  push:
    paths:
      - "supabase/functions/execution-engine/**"
      - "supabase/functions/pilot-intelligence/**"
      - "supabase/functions/alpha-e2e-selftest/**"
      - "supabase/functions/pilot-decision-journal/**"
      - "supabase/functions/pilot-background/**"
      - "supabase/functions/pilot-background/**"
      - "pilot/tests/engine-contract.mjs"
      - "pilot/tests/continuity-contract.mjs"
      - "pilot/tests/journal-contract.mjs"
      - "pilot/tests/live-e2e-contract.mjs"
      - "pilot/tests/background-contract.mjs"
      - "pilot/tests/background-contract.mjs"
      - "pilot/index.html"
      - ".github/workflows/pilot-engine-guards.yml"
  pull_request:
    paths:
      - "supabase/functions/execution-engine/**"
      - "supabase/functions/pilot-intelligence/**"
      - "supabase/functions/alpha-e2e-selftest/**"
      - "supabase/functions/pilot-decision-journal/**"
      - "supabase/functions/pilot-background/**"
      - "supabase/functions/pilot-background/**"
      - "pilot/tests/engine-contract.mjs"
      - "pilot/tests/continuity-contract.mjs"
      - "pilot/tests/journal-contract.mjs"
      - "pilot/tests/live-e2e-contract.mjs"
      - "pilot/tests/background-contract.mjs"
      - "pilot/tests/background-contract.mjs"
      - "pilot/index.html"
      - ".github/workflows/pilot-engine-guards.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Core workflow safety and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned TypeScript parser
        run: npm install --no-save --no-audit --no-fund typescript@5.9.3
      - name: Run isolated backend regression tests
        run: node pilot/tests/engine-contract.mjs
      - name: Run isolated goal-continuity regression tests
        run: node pilot/tests/continuity-contract.mjs
      - name: Run decision journal safety and revision tests
        run: node pilot/tests/journal-contract.mjs
      - name: Run background worker authorization and budget tests
        run: node pilot/tests/background-contract.mjs
      - name: Run scheduled-background security and budget tests
        run: node pilot/tests/background-contract.mjs
      - name: Check live mission test isolation and authorization
        run: node pilot/tests/live-e2e-contract.mjs
