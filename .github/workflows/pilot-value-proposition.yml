name: Pilot Value Proposition
on:
  push:
    paths:
      - 'index.html'
      - 'site-shell.css'
      - 'nx-language.js'
      - 'b2b-handel.html'
      - 'pilot/index.html'
      - 'pilot/pilot-language.js'
      - 'pilot/tests/value-proposition-contract.mjs'
      - '.github/workflows/pilot-value-proposition.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'site-shell.css'
      - 'nx-language.js'
      - 'b2b-handel.html'
      - 'pilot/index.html'
      - 'pilot/pilot-language.js'
      - 'pilot/tests/value-proposition-contract.mjs'
jobs:
  product-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check product claims and customer journey
        run: node pilot/tests/value-proposition-contract.mjs
