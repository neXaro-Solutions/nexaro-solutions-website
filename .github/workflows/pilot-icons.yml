name: Pilot X-Jet icon assets
on:
  push:
    branches: [main]
    paths:
      - "pilot/icon.svg"
      - "pilot/tools/build-icons.py"
      - ".github/workflows/pilot-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pilot-icons-main
  cancel-in-progress: false

jobs:
  build-pilot-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic image renderer
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Render real Pilot browser and mobile icons
        run: python pilot/tools/build-icons.py
      - name: Validate generated icon dimensions
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('pilot')
          targets={
              'favicon-16.png':(16,16),
              'favicon-32.png':(32,32),
              'favicon-48.png':(48,48),
              'apple-touch-icon.png':(180,180),
              'icon-192.png':(192,192),
              'icon-512.png':(512,512),
              'icon-maskable-512.png':(512,512)
          }
          for name,size in targets.items():
              with Image.open(root/name) as im:
                  assert im.size==size,(name,im.size,size)
                  im.verify()
              print('PASS',name,size)
          with Image.open(root/'favicon.ico') as im:
              assert im.format=='ICO'
          PY
      - name: Commit icons only inside Pilot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pilot/favicon-16.png pilot/favicon-32.png pilot/favicon-48.png \
            pilot/favicon.ico pilot/apple-touch-icon.png pilot/icon-192.png \
            pilot/icon-512.png pilot/icon-maskable-512.png
          if git diff --cached --quiet; then
            echo "Pilot icon assets already match the approved source."
            exit 0
          fi
          git commit -m "Pilot: publish approved X-Jet favicon and iOS Android icon family"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          echo "Icon publish failed after 3 attempts" >&2
          exit 1
