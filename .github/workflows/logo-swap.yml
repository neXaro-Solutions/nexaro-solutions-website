name: fix neXaro logo compatibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/logo-swap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace SVG logo references with standalone WebP
        shell: bash
        run: |
          set -euo pipefail
          grep -RIl --exclude-dir=.git 'nexaro-official-logo\.svg' . | while read -r file; do
            sed -i 's#nexaro-official-logo\.svg#nexaro-official-logo.webp#g' "$file"
          done
      - name: Commit compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No SVG logo references found.'
            exit 0
          fi
          git config user.name 'neXaro-Solutions'
          git config user.email 'kontakt@nexaro-solutions.de'
          git add -A
          git commit -m 'Fix neXaro logo rendering on Safari'
          git push origin main
