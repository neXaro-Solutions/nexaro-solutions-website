name: use transparent neXaro logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/logo-swap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace all official logo references with transparent WebP
        shell: bash
        run: |
          set -euo pipefail
          grep -RIl --exclude-dir=.git -E 'nexaro-(official-logo\.(svg|webp)|transparent-logo\.webp)' . | while read -r file; do
            sed -i -E 's#nexaro-official-logo\.(svg|webp)#nexaro-transparent-logo.webp#g' "$file"
          done
      - name: Commit transparent logo fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No logo references needed replacement.'
            exit 0
          fi
          git config user.name 'neXaro-Solutions'
          git config user.email 'kontakt@nexaro-solutions.de'
          git add -A
          git commit -m 'Use transparent neXaro logo without white background'
          git push origin main
